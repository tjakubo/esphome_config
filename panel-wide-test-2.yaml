esphome:
  name: "widepanel"
  
logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

network:
  enable_ipv6: false  

font:
  - file: "gfonts://Montserrat"
    id: montserrat_28
    size: 28

output:
  - id: gpio_backlight_pwm
    platform: ledc
    pin: 23

light:
  - id: backlight
    platform: monochromatic
    output: gpio_backlight_pwm
    restore_mode: ALWAYS_ON

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes 

display:
  - platform: mipi_dsi
    id: device_display
    model: JC4880P443
    rotation: 90
#    lambda: |-
#      it.fill(Color::BLACK);
#      it.print(100, 100, id(montserrat_28), Color(255, 0, 0), TextAlign::LEFT, "Red text");
#      it.print(100, 200, id(montserrat_28), Color(0, 255, 0), TextAlign::LEFT, "Green text");
#      it.print(100, 300, id(montserrat_28), Color(0, 0, 255), TextAlign::LEFT, "Blue text");

lvgl:
  byte_order: little_endian
      
touchscreen:
  platform: gt911
  i2c_id: i2c_bus
  id: device_touchscreen
  reset_pin: GPIO3
  update_interval: 100ms
  transform:
    swap_xy: true
    mirror_x: false
    mirror_y: true

esp_ldo:
  - channel: 3
    voltage: 2.5V

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

i2c:
  id: i2c_bus
  sda: 7
  scl: 8
  scan: false
  frequency: 400kHz