esphome:
  name: ${hostname}
  name_add_mac_suffix: false

esp8266:
  board: esp01_1m
  
preferences:
  flash_write_interval: 1min

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret fallback_wifi_ssid
    password: !secret fallback_wifi_password
  min_auth_mode: WPA2

network:
  enable_ipv6: false

web_server:
  port: 80

logger:
  baud_rate: 115200

mdns:
  disabled: false
  
output:
  - platform: esp8266_pwm
    id: output_channel_1
    pin: GPIO12
    frequency: ${pwm_frequency}
  - platform: esp8266_pwm
    id: output_channel_2
    pin: GPIO15
    frequency: ${pwm_frequency}
  - platform: esp8266_pwm
    id: output_channel_3
    pin: GPIO14
    frequency: ${pwm_frequency}
  - platform: esp8266_pwm
    id: output_channel_4
    pin: GPIO4
    frequency: ${pwm_frequency}