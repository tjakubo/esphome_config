defaults:
  display_timeout_seconds: 30

substitutions:
  device_type: "panel"

esphome:
  name: ${hostname}
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
    
psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin: # prevent screen flickering during OTA
      - light.turn_off:
          id: light_display_backlight
          transition_length: 0s
      - lambda: "id(light_display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret fallback_wifi_ssid
    password: !secret fallback_wifi_password
  min_auth_mode: WPA2

network:
  enable_ipv6: false  

logger:

output:
  - platform: ledc
    id: output_display_backlight
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    id: light_display_backlight
    output: output_display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 1s
    
spi:
  - id: spi_display
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: i2c_touchscreen
  sda: GPIO19
  scl:
    number: 45
    ignore_strapping_warning: true
    
display:
  - platform: st7701s
    id: display_main
    dimensions:
      width: 480
      height: 480
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: False
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]
      
touchscreen:
  - platform: gt911
    id: touch_display
    display: display_main
    on_release:
      if:
        condition: lvgl.is_paused
        then:
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: light_display_backlight
          
time:
  - id: !extend ha_time
    on_time:
      - hours: 3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_display_snow
      - hours: 3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_display_snow

switch:
  - platform: template
    name: "${device_type}/${path}/display_snow"
    id: switch_display_snow
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - lvgl.pause:

lvgl:
  on_idle:
    timeout: !lambda "return (id(number_display_timeout).state * 1000);"
    then:
      - light.turn_off: light_display_backlight
      - if:
          condition:
            switch.is_on: switch_display_snow
          then:
            lvgl.pause:
              show_snow: true
          else:
            lvgl.pause:

number:
  - platform: template
    optimistic: true
    name: "${device_type}/${path}/display_timeout"
    id: number_display_timeout
    unit_of_measurement: "s"
    initial_value: ${display_timeout_seconds}
    restore_value: true
    min_value: 3
    max_value: 180
    step: 1
    mode: box