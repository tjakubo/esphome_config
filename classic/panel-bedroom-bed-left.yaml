substitutions:
  debug_layout: false
  path: "bedroom/bed/left"
  hostname: "panel-bedroom-bed-left"

packages:
  hardware: !include _hardware.guiton_4848s040c.yaml
  sensors_diagnostic_common: !include _sensors.diagnostic.common.yaml
  forecast: !include _feature.panel.weather_24h_forecast_sensors.yaml

sensor:
  - platform: homeassistant
    id: sensor_ha_outside_temperature
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      then:
        script.execute: script_update_outside_climate
    
text_sensor:
  - platform: homeassistant
    id: text_sensor_ha_outside_weather
    entity_id: weather.forecast_home
    on_value:
      then:
        - script.execute: script_update_outside_climate
        - script.execute: script_update_forecast
  - platform: homeassistant
    id: text_sensor_ha_light_bedroom_bed_brightness
    entity_id: light.group_light_office_front
    on_value:
      - lvgl.widget.update:
          id: widget_bed_light_switch
          state:
            checked: !lambda |-
               const auto state{ id(text_sensor_ha_light_bedroom_bed_brightness)->state };
               auto brightness{ esphome::parse_number<float>(state.c_str()) };
               return brightness.has_value() && brightness.value() > 0;
      - lvgl.slider.update:
          id: widget_bed_light_brightness_slider
          animated: true
          value: !lambda |-
            const auto state{ id(text_sensor_ha_light_bedroom_bed_brightness)->state };
            return esphome::parse_number<float>(state.c_str()).value_or(0);
      - lvgl.label.update:
          id: widget_bed_light_brightness_label
          text: !lambda |-
            const auto state{ id(text_sensor_ha_light_bedroom_bed_brightness)->state };
            auto brightness{ esphome::parse_number<float>(state.c_str()) };
            return brightness.has_value() ? esphome::str_sprintf("%.0f%%", 100.0*brightness.value()/255.0) : "OFF";
    attribute: brightness
  # DUP: wardrobe
        
.lvgl_common:
  - &mixin_grid_cells_align_stretch
    grid_cell_x_align: stretch
    grid_cell_y_align: stretch
  - &mixin_forecast_cell
    recolor: true
    text_font: montserrat_16
    
mapping:
  - id: mapping_ha_weather_to_display
    from: string
    to: string
    entries:
      clear-night: Clear
      cloudy: Cloudy
      fog: Foggy
      hail: Hailing
      lightning: Stormy
      lightning-rainy: Stormy & rainy
      partlycloudy: Partly cloudy
      pouring: Very rainy
      rainy: Rainy
      snowy: Snowy
      snowy-rainy: Snowy & rainy
      sunny: Sunny
      windy: Windy
      windy-variant: Cloudy, windy
      exceptional: Unusual
      
script:
  - id: script_update_time
    then:
      - lvgl.label.update:
          id: widget_clock
          text: !lambda 'return id(ha_time).now().strftime("%H:%M");'
  - id: script_update_date
    then:
      - lvgl.label.update:
          id: widget_today_date
          text: !lambda |-
            auto now{ id(ha_time).now() };
            const std::string weekDayAndMonth{ now.strftime("%A, %B") };
            const auto monthDay{ esphome::parse_number<int>(now.strftime("%d")).value() };
            return esphome::str_sprintf("%s %d", weekDayAndMonth.c_str(), monthDay);
  - id: script_update_outside_climate
    then:
      - lvgl.label.update:
          id: widget_current_outside_temperature
          text: !lambda 'return esphome::str_sprintf("%.1f°", id(sensor_ha_outside_temperature).state);'
      - lvgl.label.update:
          id: widget_current_outside_conditions
          text: !lambda 'return id(mapping_ha_weather_to_display).get(id(text_sensor_ha_outside_weather).state.c_str());'
  - id: script_update_forecast
    then: !include 
      file: _lvgl.panel.update_24h_weather_forecasts.yaml
      vars:
        forecast_format: '#808080 %d:00#\n%.1f°\n#8888ff %d%%#'
  - id: script_control_light
    parameters:
      brightness: int
      entity_id: string
    then:
      - if:
          condition:
            lambda: 'return brightness > 0;'
          then:
            homeassistant.service:
              service: light.turn_on
              data:
                 entity_id: !lambda 'return entity_id;'
                 transition: '1'
              data_template:
                 brightness: !lambda 'return brightness;'
          else:
            homeassistant.service:
              service: light.turn_off
              data:
                entity_id: !lambda 'return entity_id;'
  - id: script_control_light_bed
    parameters:
      brightness: int
    then:
      - script.execute:
          id: script_control_light
          brightness: !lambda return brightness;
          #entity_id: light.group_light_bedroom_bed
          entity_id: light.group_light_office_front
  # DUP: wardrobe
  - id: script_update_light_controls
    parameters:
      brightness: int
      zxxx: 'lv_obj_t*'
      slider: 'lv_obj_t*'
      label: 'lv_obj_t*'
    then:
      - lvgl.widget.update:
          id: !lambda ''
          state:
            checked: !lambda |-
               const auto state{ id(text_sensor_ha_light_bedroom_wardrobe_brightness)->state };
               auto brightness{ esphome::parse_number<float>(state.c_str()) };
               return brightness.has_value() && brightness.value() > 0;
      #- lvgl.slider.update:
      #    id: widget_wardrobe_light_brightness_slider
      #    #animate: true
      #    value: !lambda |-
      #      const auto state{ id(text_sensor_ha_light_bedroom_wardrobe_brightness)->state };
      #      return esphome::parse_number<float>(state.c_str()).value_or(0);
      #- lvgl.label.update:
      #    id: widget_wardrobe_light_brightness_label
      #    text: !lambda |-
      #      const auto state{ id(text_sensor_ha_light_bedroom_wardrobe_brightness)->state };
      #      auto brightness{ esphome::parse_number<float>(state.c_str()) };
      #      return brightness.has_value() ? esphome::str_sprintf("%.0f%%", 100.0*brightness.value()/255.0) : "OFF";

time:
  - id: !extend ha_time
    on_time_sync:
      - script.execute: script_update_time
      - script.execute: script_update_date
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          script.execute: script_update_time
      - hours: 0
        then:
          script.execute: script_update_date
  
font:
  - file: "fonts/Montserrat-Regular.ttf"  # Use your font file path
    id: montserrat_65
    size: 65
    glyphs: "0123456789:.°"
    bpp: 4
  
lvgl:    
  theme:    
    container:
      bg_color: 0x1d1d1d
      text_color: 0xe0e0e0
      #border_color: 0x2d2d2d
      #border_width: ${ 1 if debug_layout else 0 }
      #border_color: 0x00ff00
      #border_width: 1
      
    obj:
      bg_color: 0x1d1d1d
      text_color: 0xe0e0e0
      border_color: 0x2d2d2d
      border_width: 2
      
    label:
      text_color: 0xe0e0e0
      border_width: ${ 1 if debug_layout else 0 }  

    switch:
      border_width: ${ 1 if debug_layout else 0 }  
      
    slider:
      border_width: ${ 1 if debug_layout else 0 }  
    
  pages:
    - id: page_main
      bg_color: 0x0d0d0d
      layout:
        type: grid
        grid_rows: [fr(2), fr(1), fr(1)]
        grid_columns: [fr(1)]
        pad_row: 10
        pad_column: 10
      pad_all: 10
      widgets:
        - obj:
            <<: *mixin_grid_cells_align_stretch
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_between
              flex_align_cross: stretch
            pad_top: 0
            widgets:
              - container:
                  height: size_content
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        id: widget_clock
                        text_font: montserrat_65
                    - label:
                        id: widget_current_outside_temperature
                        text_font: montserrat_65
              - container:
                  height: size_content
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        id: widget_today_date
                        text_font: montserrat_20
                    - label:
                        id: widget_current_outside_conditions
                        text_font: montserrat_20
              - container:
                  height: size_content
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label: 
                        id: widget_forecast_3h
                        <<: *mixin_forecast_cell
                    - label: 
                        id: widget_forecast_6h
                        <<: *mixin_forecast_cell
                    - label: 
                        id: widget_forecast_9h
                        <<: *mixin_forecast_cell
                    - label: 
                        id: widget_forecast_12h
                        <<: *mixin_forecast_cell
                    - label: 
                        id: widget_forecast_15h
                        <<: *mixin_forecast_cell
                    - label: 
                        id: widget_forecast_18h
                        <<: *mixin_forecast_cell
                    - label: 
                        id: widget_forecast_21h
                        <<: *mixin_forecast_cell
                    - label: 
                        id: widget_forecast_24h
                        <<: *mixin_forecast_cell
                        
        - container:
            <<: *mixin_grid_cells_align_stretch
            layout:
              type: grid
              grid_rows: [fr(1)]
              grid_columns: [fr(1), fr(1)]
              pad_row: 10
              pad_column: 10
            widgets:
              - obj:
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: space_between
                  <<: *mixin_grid_cells_align_stretch
                  widgets:
                    - container:
                        height: size_content
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_cross: center
                        widgets:
                          - label:
                              text: Main light
                              text_font: montserrat_16
                          - switch:
                              id: widget_bed_light_switch
                              on_change:
                                #- switch.control:
                                #    id: switch_ha_light_bedroom_bed
                                #    state: !lambda return x;
                                script.execute:
                                  id: script_control_light_bed
                                  brightness: !lambda 'return x ? 255 : 0;'
                    - container:
                        height: size_content
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_cross: center
                        widgets:
                          - container:
                              width: 80%
                              height: size_content
                              pad_top: 10
                              pad_bottom: 8
                              pad_left: 10
                              pad_right: 10
                              widgets:
                                - slider:
                                    id: widget_bed_light_brightness_slider
                                    max_value: 255
                                    width: 100%
                                    height: 7
                                    knob:
                                      pad_all: 3
                          - label:
                              id: widget_bed_light_brightness_label
                              text_font: montserrat_14
              - obj:
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: space_between
                  <<: *mixin_grid_cells_align_stretch
                  widgets:
                    - container:
                        height: size_content
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_cross: center
                        widgets:
                          - label:
                              text: Side light
                              text_font: montserrat_16
                          - switch:
                              id: widget_wardrobe_light_switch
                              on_change:
                                #- switch.control:
                                #    id: switch_ha_light_bedroom_wardrobe
                                #    state: !lambda return x;
                                script.execute:
                                  id: script_control_light_wardrobe
                                  brightness: !lambda 'return x ? 255 : 0;'
                    - container:
                        height: size_content
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_cross: center
                        widgets:
                          - container:
                              width: 80%
                              height: size_content
                              pad_top: 10
                              pad_bottom: 8
                              pad_left: 10
                              pad_right: 10
                              widgets:
                                - slider:
                                    id: widget_wardrobe_light_brightness_slider
                                    max_value: 255
                                    width: 100%
                                    height: 7
                                    knob:
                                      pad_all: 3
                          - label:
                              id: widget_wardrobe_light_brightness_label
                              text_font: montserrat_14